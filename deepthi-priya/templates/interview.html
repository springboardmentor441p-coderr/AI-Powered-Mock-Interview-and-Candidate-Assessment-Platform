<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHire AI - Mock Interview</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <div class="container">

        <h1>🎤 SmartHire AI Mock Interview</h1>

        <p>Welcome to your AI-powered mock interview.</p>

        <h3>Interview Question</h3>

<div id="question">
    Click "Start Interview" to begin.
</div>

<br>

<button id="startBtn">Start Interview</button>

<button id="speakBtn" disabled>🔊 Speak Question</button>

<br><br>

<h3>Your Answer</h3>

<textarea
    id="answer"
    rows="6"
    cols="70"
    placeholder="Your answer will appear here..."></textarea>

<br><br>

<button id="startBtn">🎤 Start Speaking</button>

<button id="nextBtn" disabled>Next Question</button>

<button id="endBtn">End Interview</button>

    </div>

    <script src="/static/js/interview.js"></script>

</body>
</html>
