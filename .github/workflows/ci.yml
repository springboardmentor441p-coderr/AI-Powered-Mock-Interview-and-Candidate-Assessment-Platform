name: SmartHire AI CI/CD Pipeline

on:
  push:
    branches: [ main, master, final-smart-hire-submission, janitha-submission, project-main ]
  pull_request:
    branches: [ main, master, final-smart-hire-submission, janitha-submission, project-main ]

jobs:
  build-and-test:
    name: Build, Test & Lint Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10 Runtime Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Backend Dependencies & Validate FastAPI API Gateway
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js 18 Environment for Frontend
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Frontend Dependencies & Build Production Bundle
        run: |
          cd frontend
          npm install
          npm run build

      - name: Verify Docker Container Build Readiness
        run: |
          docker build -t smarthire-backend:latest .
