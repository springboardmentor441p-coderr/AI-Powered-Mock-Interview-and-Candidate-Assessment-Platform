version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ../.env
    volumes:
      - ../uploads:/app/uploads
      - ../instance:/app/instance
    restart: unless-stopped

